<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Click-bait thumbnails: reading vs scrolling, results hidden</title>
<style>
  html, body { margin:0; padding:0; background:#000; }
  #t { position:relative; width:1280px; height:720px; overflow:hidden; background:#111; font-family: Impact, 'Arial Black', 'Segoe UI Black', sans-serif; }
  .abs { position:absolute; left:0; top:0; width:1280px; height:720px; pointer-events:none; }
  canvas.half { position:absolute; top:0; }
  svg.txt { position:absolute; left:0; top:0; width:1280px; height:720px; }
  svg.txt text { paint-order: stroke fill; stroke-linejoin: round; text-anchor: middle; font-family: Impact, 'Arial Black', 'Segoe UI Black', sans-serif; }
</style>
</head>
<body>
<div id="t"></div>
<script>
const v = new URLSearchParams(location.search).get('v') || 'a';
const root = document.getElementById('t');
const wideTop = v !== 'c';
const load = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
const layer = (css) => { const d = document.createElement('div'); d.className = 'abs'; d.style.cssText = css; root.appendChild(d); return d; };
async function half(file, ox, oy, s, W, H, bx, by, R, k) {
  const img = await load('../public/images/' + file + '.png');
  const c = document.createElement('canvas'); c.width = W; c.height = H; c.className = 'half';
  const g = c.getContext('2d', {willReadFrequently: true}); g.imageSmoothingQuality = 'high';
  g.drawImage(img, ox, oy, W / s, H / s, 0, 0, W, H);
  const src = g.getImageData(0, 0, W, H), out = g.createImageData(W, H), sd = src.data, od = out.data;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let sx = x, sy = y; const dx = x - bx, dy = y - by, r = Math.hypot(dx, dy);
    if (r < R) { const t = r / R, f = 1 - k * (1 - t * t) * (1 - t * t); sx = bx + dx * f; sy = by + dy * f; }
    const x0 = Math.floor(sx), y0 = Math.floor(sy), fx = sx - x0, fy = sy - y0, o = (y * W + x) * 4;
    for (let ch = 0; ch < 4; ch++) {
      const p = (xx, yy) => sd[(Math.min(H - 1, Math.max(0, yy)) * W + Math.min(W - 1, Math.max(0, xx))) * 4 + ch];
      od[o + ch] = (p(x0, y0) * (1 - fx) + p(x0 + 1, y0) * fx) * (1 - fy) + (p(x0, y0 + 1) * (1 - fx) + p(x0 + 1, y0 + 1) * fx) * fy;
    }
  }
  g.putImageData(out, 0, 0);
  return c;
}
const svgLayer = (inner) => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('class', 'txt'); s.setAttribute('viewBox', '0 0 1280 720'); s.innerHTML = inner; root.appendChild(s); };
const T = (txt, x, y, size, fill, sw = 26, extra = '') => `<text x="${x}" y="${y}" font-size="${size}" fill="${fill}" stroke="#000" stroke-width="${sw}" ${extra}>${txt}</text>`;
// a hand-drawn looking red circle (slightly open, slightly wobbly) to point at what each man is doing
const circle = (cx, cy, rx, ry, rot) => `<g transform="rotate(${rot} ${cx} ${cy})"><ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="#000" stroke-width="22" stroke-dasharray="${(rx + ry) * 5.6} 40" stroke-linecap="round"/><ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="#ff2a2a" stroke-width="12" stroke-dasharray="${(rx + ry) * 5.6} 40" stroke-linecap="round"/></g>`;
const arrow = (x1, y1, x2, y2) => { const a = Math.atan2(y2 - y1, x2 - x1), h = 34, p = (an, l) => `${x2 - Math.cos(a + an) * l},${y2 - Math.sin(a + an) * l}`;
  return `<g stroke-linecap="round" stroke-linejoin="round"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#000" stroke-width="30"/><polyline points="${p(0.5, h)} ${x2},${y2} ${p(-0.5, h)}" fill="none" stroke="#000" stroke-width="30"/>
  <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#ff2a2a" stroke-width="16"/><polyline points="${p(0.5, h)} ${x2},${y2} ${p(-0.5, h)}" fill="none" stroke="#ff2a2a" stroke-width="16"/></g>`; };

(async () => {
  const s = wideTop ? 1.3 : 1.12, hy = wideTop ? 352 : 246, gX = 290, rX = 548;
  const BOOK = wideTop ? [452, 618] : [452, 498], PHONE = wideTop ? [790, 596] : [830, 482];
  const left = await half('FL_G1', 484 - gX / s, 650 - hy / s, s, 780, 720, gX, hy + 14, 240, 0.4);
  const right = await half('FL_R4', 1900 - rX / s, 560 - hy / s, s, 780, 720, rX, hy + 14, 240, 0.4);
  left.style.left = '0px'; left.style.clipPath = 'polygon(0 0, 800px 0, 640px 720px, 0 720px)'; left.style.filter = 'saturate(1.55) contrast(1.16) brightness(1.04)';
  right.style.left = '500px'; right.style.clipPath = 'polygon(300px 0, 780px 0, 780px 720px, 140px 720px)'; right.style.filter = 'saturate(1.9) contrast(1.22) brightness(1.04) hue-rotate(-4deg)';
  // vivid colour blocks behind the art: the rooms become bright warm vs bright cold
  layer('background: linear-gradient(135deg, #ffb300, #ff6a00); clip-path: polygon(0 0, 800px 0, 640px 720px, 0 720px)');
  layer('background: linear-gradient(225deg, #00b7ff, #1a3cff); clip-path: polygon(800px 0, 1280px 0, 1280px 720px, 640px 720px)');
  root.appendChild(left); root.appendChild(right);
  layer('background: radial-gradient(ellipse 330px 440px at 300px 420px, #ffffff 42%, rgba(255,110,20,.96) 100%); clip-path: polygon(0 0, 800px 0, 640px 720px, 0 720px); mix-blend-mode: multiply');
  layer('background: radial-gradient(ellipse 370px 450px at 1040px 430px, #ffffff 42%, rgba(30,110,255,.97) 100%); clip-path: polygon(800px 0, 1280px 0, 1280px 720px, 640px 720px); mix-blend-mode: multiply');
  layer('background: radial-gradient(ellipse 380px 380px at 250px 330px, rgba(255,255,220,.22), rgba(255,255,220,0) 70%); clip-path: polygon(0 0, 800px 0, 640px 720px, 0 720px); mix-blend-mode: screen');
  layer('background: radial-gradient(ellipse 380px 380px at 1010px 350px, rgba(190,245,255,.2), rgba(190,245,255,0) 70%); clip-path: polygon(800px 0, 1280px 0, 1280px 720px, 640px 720px); mix-blend-mode: screen');
  layer('background: radial-gradient(ellipse at center, rgba(0,0,0,0) 62%, rgba(0,0,0,.28) 100%)');

  const seam = `<line x1="800" y1="-10" x2="640" y2="730" stroke="#000" stroke-width="22"/><line x1="800" y1="-10" x2="640" y2="730" stroke="#fff" stroke-width="12"/>`;
  const vs = (x, y) => `<g transform="rotate(-6 ${x} ${y})"><circle cx="${x}" cy="${y}" r="64" fill="#000"/><circle cx="${x}" cy="${y}" r="56" fill="#ffe600"/><text x="${x}" y="${y + 24}" font-size="70" fill="#d40000" stroke="none" style="paint-order:normal">VS</text></g>`;
  const marks = circle(BOOK[0], BOOK[1], wideTop ? 175 : 165, wideTop ? 118 : 108, -8) + circle(PHONE[0], PHONE[1], wideTop ? 92 : 88, wideTop ? 138 : 128, 14);
  let title = '';
  if (v === 'a') title = T('ONE HABIT', 640, 168, 196, '#ffffff', 30, 'letter-spacing="3" transform="rotate(-2 640 130)"');
  else if (v === 'b') title = T('1 YEAR LATER', 640, 166, 168, '#ffee00', 30, 'letter-spacing="2" transform="rotate(-2 640 130)"');
  else title = `<g transform="rotate(-1.5 640 650)"><text x="640" y="692" font-size="128" stroke="#000" stroke-width="30"><tspan fill="#ffffff">WHICH ONE </tspan><tspan fill="#ffee00">ARE YOU?</tspan></text></g>`;
  svgLayer(seam + marks + vs(720, wideTop ? 470 : 380) + title);
  document.title = 'ready';
})();
</script>
</body>
</html>
