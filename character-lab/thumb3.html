<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thumbnails: reading vs scrolling, results hidden</title>
<style>
  html, body { margin:0; padding:0; background:#000; }
  #t { position:relative; width:1280px; height:720px; overflow:hidden; font-family: Impact, 'Arial Black', 'Segoe UI Black', sans-serif; background:#000; }
  .abs { position:absolute; inset:0; pointer-events:none; }
  canvas.half { position:absolute; top:0; }
  svg.txt { position:absolute; inset:0; width:1280px; height:720px; }
  svg.txt text { paint-order: stroke fill; stroke-linejoin: round; text-anchor: middle; font-family: Impact, 'Arial Black', 'Segoe UI Black', sans-serif; }
</style>
</head>
<body>
<div id="t"></div>
<script>
const v = new URLSearchParams(location.search).get('v') || 'a';
const root = document.getElementById('t');
const load = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
const layer = (css) => { const d = document.createElement('div'); d.className = 'abs'; d.style.cssText = css; root.appendChild(d); return d; };

// Draw part of a source image into a canvas, then swell the face with a caricature bulge (eyes get bigger, the face feels exaggerated).
async function half(file, ox, oy, s, W, H, bx, by, R, k) {
  const img = await load('../public/images/' + file + '.png');
  const c = document.createElement('canvas'); c.width = W; c.height = H; c.className = 'half';
  const g = c.getContext('2d', {willReadFrequently: true}); g.imageSmoothingQuality = 'high';
  g.drawImage(img, ox, oy, W / s, H / s, 0, 0, W, H);
  const src = g.getImageData(0, 0, W, H), out = g.createImageData(W, H), sd = src.data, od = out.data;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let sx = x, sy = y; const dx = x - bx, dy = y - by, r = Math.hypot(dx, dy);
    if (r < R) { const t = r / R, f = 1 - k * (1 - t * t) * (1 - t * t); sx = bx + dx * f; sy = by + dy * f; }
    const x0 = Math.floor(sx), y0 = Math.floor(sy), fx = sx - x0, fy = sy - y0, o = (y * W + x) * 4;
    for (let ch = 0; ch < 4; ch++) {
      const p = (xx, yy) => sd[(Math.min(H - 1, Math.max(0, yy)) * W + Math.min(W - 1, Math.max(0, xx))) * 4 + ch];
      od[o + ch] = (p(x0, y0) * (1 - fx) + p(x0 + 1, y0) * fx) * (1 - fy) + (p(x0, y0 + 1) * (1 - fx) + p(x0 + 1, y0 + 1) * fx) * fy;
    }
  }
  g.putImageData(out, 0, 0);
  return c;
}
const T = (txt, x, y, size, fill, sw = 22, stroke = '#000', extra = '') => `<text x="${x}" y="${y}" font-size="${size}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" ${extra}>${txt}</text>`;
const addText = (inner) => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('class', 'txt'); s.setAttribute('viewBox', '0 0 1280 720'); s.innerHTML = inner; root.appendChild(s); };

(async () => {
  // framing: big heads (exaggerated), objects clearly visible; A and B have text on top, C has text at the bottom
  const top = v !== 'c', s = top ? 1.28 : 1.1, hy = top ? 352 : 246;
  // source positions (full 2752 x 1536 images): Green head (484,650), Red head (1900,560)
  const gX = 290, rX = 548;
  const left = await half('FL_G1', 484 - gX / s, 650 - hy / s, s, 780, 720, gX, hy + 14, 230, 0.34);
  const right = await half('FL_R4', 1900 - rX / s, 560 - hy / s, s, 780, 720, rX, hy + 14, 230, 0.34);
  left.style.left = '0px'; left.style.clipPath = 'polygon(0 0, 800px 0, 640px 720px, 0 720px)'; left.style.filter = 'saturate(1.45) contrast(1.12) brightness(0.98) sepia(.05)';
  right.style.left = '500px'; right.style.clipPath = 'polygon(300px 0, 780px 0, 780px 720px, 140px 720px)'; right.style.filter = 'saturate(1.35) contrast(1.15) brightness(.92) hue-rotate(-4deg)';
  root.appendChild(left); root.appendChild(right);
  // light: warm lamp glow on the reader, cold screen glow on the scroller
  layer('background: radial-gradient(ellipse 430px 430px at 250px 360px, rgba(255,200,90,.30), rgba(255,170,40,0) 70%); clip-path:polygon(0 0, 800px 0, 640px 720px, 0 720px); mix-blend-mode:screen');
  layer('background: radial-gradient(ellipse 380px 420px at 880px 500px, rgba(70,185,255,.5), rgba(40,120,255,0) 70%); clip-path:polygon(800px 0, 1280px 0, 1280px 720px, 640px 720px); mix-blend-mode:screen');
  layer('background: linear-gradient(180deg, rgba(0,0,0,.6) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 62%, rgba(0,0,0,.72) 100%)');
  layer('background: radial-gradient(ellipse at center, rgba(0,0,0,0) 52%, rgba(0,0,0,.6) 100%)');
  const slash = `<defs><filter id="gl" x="-50%" y="-5%" width="200%" height="110%"><feGaussianBlur stdDeviation="9"/></filter></defs>
    <line x1="800" y1="-10" x2="640" y2="730" stroke="#fff" stroke-width="14" filter="url(#gl)" opacity=".9"/><line x1="800" y1="-10" x2="640" y2="730" stroke="#fff" stroke-width="6"/>`;
  if (v === 'a') {
    addText(slash + T('ONE HABIT', 640, 168, 188, '#ffffff', 26, '#000', 'letter-spacing="3"'));
  } else if (v === 'b') {
    // a faint clock face behind everything says "time passes"; the text says how much
    const ticks = Array.from({length: 12}).map((_, i) => { const a = i * Math.PI / 6; return `<line x1="${720 + Math.sin(a) * 300}" y1="${360 - Math.cos(a) * 300}" x2="${720 + Math.sin(a) * 340}" y2="${360 - Math.cos(a) * 340}" stroke="#fff" stroke-width="${i % 3 ? 6 : 12}" stroke-linecap="round"/>`; }).join('');
    addText(`<g opacity=".16"><circle cx="720" cy="360" r="290" fill="none" stroke="#fff" stroke-width="10"/>${ticks}<line x1="720" y1="360" x2="720" y2="150" stroke="#fff" stroke-width="12" stroke-linecap="round"/><line x1="720" y1="360" x2="860" y2="410" stroke="#fff" stroke-width="12" stroke-linecap="round"/></g>`
      + slash + T('1 YEAR LATER', 640, 168, 160, '#ffe14a', 26, '#000', 'letter-spacing="2"'));
  } else {
    addText(slash + `<text x="640" y="690" font-size="122" stroke="#000" stroke-width="22"><tspan fill="#ffffff">WHICH ONE </tspan><tspan fill="#ffd23f">ARE YOU?</tspan></text>`);
  }
  document.title = 'ready';
})();
</script>
</body>
</html>
