<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thumbnails for A/B testing</title>
<style>
  html, body { margin:0; padding:0; background:#000; }
  #t { position:relative; width:1280px; height:720px; overflow:hidden; font-family: Impact, 'Arial Black', 'Segoe UI Black', sans-serif; }
  .abs { position:absolute; inset:0; }
  canvas.head { position:absolute; }
  svg.txt { position:absolute; inset:0; width:1280px; height:720px; }
  svg.txt text { paint-order: stroke fill; stroke-linejoin: round; text-anchor: middle; font-family: Impact, 'Arial Black', 'Segoe UI Black', sans-serif; }
</style>
</head>
<body>
<div id="t"></div>
<script>
const v = new URLSearchParams(location.search).get('v') || 'a';
const root = document.getElementById('t');
const load = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });

// A head sprite with a caricature "bulge": the eye area is magnified, so the face feels exaggerated and slightly uncanny.
async function head(name, S, k = 0.42, cyf = 0.45, Rf = 0.47) {
  const img = await load(`../public/images/heads/${name}.png`);
  const c = document.createElement('canvas'); c.width = c.height = S; c.className = 'head';
  const g = c.getContext('2d', {willReadFrequently: true}); g.imageSmoothingQuality = 'high';
  const m = S * 0.1; g.drawImage(img, m, m, S - 2 * m, S - 2 * m);          // padding: the head swells without being cut by the canvas edge
  const src = g.getImageData(0, 0, S, S), out = g.createImageData(S, S), sd = src.data, od = out.data;
  const cx = S / 2, cy = S * cyf, R = S * Rf;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    let sx = x, sy = y; const dx = x - cx, dy = y - cy, r = Math.hypot(dx, dy);
    if (r < R) { const t = r / R, f = 1 - k * (1 - t * t); sx = cx + dx * f; sy = cy + dy * f; }
    const x0 = Math.floor(sx), y0 = Math.floor(sy), fx = sx - x0, fy = sy - y0, o = (y * S + x) * 4;
    for (let ch = 0; ch < 4; ch++) {
      const p = (xx, yy) => sd[(Math.min(S - 1, Math.max(0, yy)) * S + Math.min(S - 1, Math.max(0, xx))) * 4 + ch];
      od[o + ch] = (p(x0, y0) * (1 - fx) + p(x0 + 1, y0) * fx) * (1 - fy) + (p(x0, y0 + 1) * (1 - fx) + p(x0 + 1, y0 + 1) * fx) * fy;
    }
  }
  g.putImageData(out, 0, 0);
  return c;
}
const place = (c, cx, cy, rot, filter) => { c.style.left = (cx - c.width / 2) + 'px'; c.style.top = (cy - c.height / 2) + 'px'; c.style.transform = `rotate(${rot}deg)`; c.style.filter = filter; root.appendChild(c); };
const layer = (css) => { const d = document.createElement('div'); d.className = 'abs'; d.style.cssText = css; root.appendChild(d); return d; };
const T = (txt, x, y, size, fill, sw = 22, stroke = '#000', extra = '') => `<text x="${x}" y="${y}" font-size="${size}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" ${extra}>${txt}</text>`;
const text = (inner) => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('class', 'txt'); s.setAttribute('viewBox', '0 0 1280 720'); s.innerHTML = inner; root.appendChild(s); };

(async () => {
  if (v === 'a') {                                   // ONE HABIT: the knowing smirk, huge and golden
    layer('background: radial-gradient(circle at 50% 58%, #ffd770 0%, #f0922a 30%, #6a2f06 66%, #0c0602 100%)');
    layer('background: repeating-conic-gradient(from 0deg at 50% 58%, rgba(255,255,255,.10) 0 5deg, rgba(255,255,255,0) 5deg 10deg); -webkit-mask-image: radial-gradient(circle at 50% 58%, #000 10%, transparent 72%); mask-image: radial-gradient(circle at 50% 58%, #000 10%, transparent 72%)');
    const h = await head('proud', 950, 0.46);
    place(h, 640, 442, -5, 'drop-shadow(0 0 46px rgba(255,214,110,.95)) drop-shadow(0 26px 34px rgba(0,0,0,.65))');
    layer('background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.6) 100%)');
    text(T('ONE HABIT', 640, 168, 176, '#ffffff', 26, '#000', 'letter-spacing="3"'));
  } else if (v === 'b') {                             // 1 YEAR LATER: the hollow, bloodshot stare in cold light
    layer('background: radial-gradient(circle at 50% 62%, #3a56ff 0%, #1b2370 32%, #080a26 70%, #02030c 100%)');
    layer('background: radial-gradient(ellipse 520px 300px at 50% 100%, rgba(80,200,255,.55), rgba(80,200,255,0) 70%)');
    const h = await head('bloodshot', 950, 0.5);
    place(h, 640, 452, 4, 'drop-shadow(0 0 48px rgba(90,190,255,.95)) drop-shadow(0 26px 34px rgba(0,0,0,.7)) saturate(1.15) contrast(1.05)');
    layer('background: radial-gradient(ellipse at center, rgba(0,0,0,0) 52%, rgba(0,0,0,.72) 100%)');
    text(T('1 YEAR', 640, 142, 150, '#ffe14a', 24, '#000', 'letter-spacing="2"') + T('LATER', 640, 276, 150, '#ffe14a', 24, '#000', 'letter-spacing="2"'));
  } else {                                            // WHICH ONE ARE YOU?: two faces, facing off
    layer('background: linear-gradient(90deg, #f4a63a 0%, #8a4a10 44%, #0c1033 56%, #2638d6 100%)');
    layer('background: radial-gradient(ellipse 420px 420px at 25% 46%, rgba(255,215,120,.7), rgba(255,215,120,0) 70%), radial-gradient(ellipse 420px 420px at 75% 46%, rgba(90,190,255,.65), rgba(90,190,255,0) 70%)');
    const l = await head('proud', 700, 0.46), r = await head('bloodshot', 700, 0.5);
    place(l, 322, 322, -6, 'drop-shadow(0 0 40px rgba(255,214,110,.95)) drop-shadow(0 22px 28px rgba(0,0,0,.6))');
    place(r, 958, 322, 6, 'drop-shadow(0 0 40px rgba(90,190,255,.95)) drop-shadow(0 22px 28px rgba(0,0,0,.6))');
    layer('background: linear-gradient(180deg, rgba(0,0,0,0) 62%, rgba(0,0,0,.78) 100%)');
    layer('background: radial-gradient(ellipse at center, rgba(0,0,0,0) 56%, rgba(0,0,0,.55) 100%)');
    text(`<defs><filter id="gl" x="-50%" y="-5%" width="200%" height="110%"><feGaussianBlur stdDeviation="8"/></filter></defs><line x1="690" y1="-10" x2="590" y2="730" stroke="#fff" stroke-width="12" filter="url(#gl)" opacity=".9"/><line x1="690" y1="-10" x2="590" y2="730" stroke="#fff" stroke-width="5"/>`
      + `<text x="640" y="688" font-size="124" stroke="#000" stroke-width="22"><tspan fill="#ffffff">WHICH ONE </tspan><tspan fill="#ffd23f">ARE YOU?</tspan></text>`);
  }
  document.title = 'ready';
})();
</script>
</body>
</html>
